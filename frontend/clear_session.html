<!DOCTYPE html>
<html>
<head>
    <title>Clearing Session & Updating TalentBridge...</title>
    <script>
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
        setTimeout(function() {
            window.location.href = '/?refresh=' + Date.now();
        }, 500);
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
    <h2>Clearing Browser Cache & Loading Latest Version...</h2>
    <p>Redirecting to TalentBridge Web Portal...</p>
</body>
</html>
